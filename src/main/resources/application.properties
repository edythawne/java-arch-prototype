spring.application.name=sgc
spring.datasource.url=jdbc:mariadb://localhost:3306/db_sgc?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Muestra la sentencia SQL ejecutada
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible en múltiples líneas
spring.jpa.properties.hibernate.format_sql=false
# Agrega comentarios en el SQL indicando qué operación JPA se ejecutó
spring.jpa.properties.hibernate.use_sql_comments=true
# Muestra los valores reales de los parámetros (las variables '?' en los PreparedStatements)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Loggea las sentencias SQL ejecutadas por JdbcTemplate
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
# Loggea los parámetros pasados a las consultas (?)
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE